[workspace]
resolver = "2"
members = ["crates/warpjq-core", "crates/warpjq-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/athrva98/warpjq"
homepage = "https://github.com/athrva98/warpjq"
authors = ["warpjq contributors"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
memmap2 = "0.9"
rayon = "1"
simd-json = "0.14"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
ryu = "1"
itoa = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
