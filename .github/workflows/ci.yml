name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A nightly long fuzz run, so the "N CPU-hours without a crash" claim in
    # the README keeps being true rather than being true once.
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The build every contributor and every `cargo install` user gets: no GPU,
  # no CUDA toolkit, nothing but a Rust toolchain.
  cpu:
    name: CPU build and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install jq
        shell: bash
        run: |
          # The differential tests are far weaker without it, so make its
          # absence a deliberate choice rather than an accident.
          if command -v jq >/dev/null; then jq --version; exit 0; fi
          case "${{ runner.os }}" in
            Linux)   sudo apt-get update && sudo apt-get install -y jq ;;
            macOS)   brew install jq ;;
            Windows) choco install jq -y ;;
          esac
          jq --version

      - name: Tests
        run: cargo test --workspace --release

      - name: Tests with debug assertions
        # The release profile compiles out debug_assert!, so contract
        # violations it guards are invisible to the run above. The fuzz
        # targets build with debug-assertions on and found one that way.
        run: cargo test --workspace

      - name: Differential tests (CPU vs jq)
        run: cargo test -p warpjq-core --release --test differential -- --nocapture

      - name: Self-check against generated data
        shell: bash
        run: |
          set -euo pipefail
          W=./target/release/warpjq
          [ "${{ runner.os }}" = "Windows" ] && W=./target/release/warpjq.exe
          for preset in nginx cloudtrail k8s nested; do
            $W gen --preset "$preset" --size 20MB -o "/tmp/$preset.ndjson" --seed 1
            # Every generated line must be valid JSON by jq's reckoning too.
            jq -e . "/tmp/$preset.ndjson" > /dev/null
            echo "$preset: $($W 'count' "/tmp/$preset.ndjson") lines"
          done
          # The seed contract: same seed, same bytes.
          $W gen --preset nginx --size 5MB -o /tmp/a.ndjson --seed 42
          $W gen --preset nginx --size 5MB -o /tmp/b.ndjson --seed 42
          cmp /tmp/a.ndjson /tmp/b.ndjson

  # The GPU build. Compiling needs only the CUDA toolkit; *running* needs a
  # device, which hosted runners do not have. So this job proves the kernels
  # compile and link on every push, and the GPU differential tests run on a
  # self-hosted runner when one is available.
  cuda-build:
    name: CUDA build (compile only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: Jimver/cuda-toolkit@v0.2.19
        id: cuda
        with:
          cuda: "12.6.0"
          method: network
          sub-packages: '["nvcc", "cudart-dev"]'
      - name: Build with CUDA
        run: cargo build --release -p warpjq-cli --features cuda
      - name: Confirm it degrades gracefully without a device
        run: |
          # No GPU here, so `auto` must fall back silently and `gpu` must fail
          # with a clear message rather than a CUDA error dump.
          echo '{"a":1}' | ./target/release/warpjq '.a' --backend auto
          if echo '{"a":1}' | ./target/release/warpjq '.a' --backend gpu; then
            echo "expected --backend gpu to fail without a device"; exit 1
          fi

  gpu:
    name: GPU differential tests
    runs-on: [self-hosted, cuda]
    # Only runs where a labelled self-hosted runner with a GPU exists. Skipped
    # elsewhere rather than failing, but never silently passing: the job name
    # is absent from the checks list when it did not run.
    if: github.repository_owner != '' && contains(github.event.repository.topics, 'has-gpu-runner')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: nvidia-smi
      - name: Differential tests (GPU vs CPU vs jq)
        # Single-threaded on purpose. Each test builds its own device context
        # with its own staging buffers, and the harness's default parallelism
        # will exhaust a small card. The code degrades from that rather
        # than failing, but that turns the test into a CPU-vs-CPU comparison
        # and quietly stops testing the GPU at all.
        run: |
          cargo test -p warpjq-core --release --features cuda \
            --test differential -- --include-ignored --nocapture --test-threads=1

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: sudo apt-get update && sudo apt-get install -y jq
      - name: Measure
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info -- --test-threads=1
      - name: Enforce a floor
        # Not a target to chase upward. It is a ratchet, so the CLI and the
        # benchmark harness cannot silently return to zero coverage the way
        # they started.
        run: |
          cargo llvm-cov report --summary-only | tee summary.txt
          PCT=$(grep -E '^TOTAL' summary.txt | awk '{print $(NF-3)}' | tr -d '%')
          echo "line coverage: $PCT%"
          awk -v p="$PCT" 'BEGIN { exit (p+0 >= 85) ? 0 : 1 }' || {
            echo "::error::line coverage $PCT% is below the 85% floor"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: lcov.info

  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parse_line, query, run_ndjson]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz
        # 60s per target on PRs; the nightly schedule runs far longer.
        run: |
          SECS=60
          if [ "${{ github.event_name }}" = "schedule" ]; then SECS=3600; fi
          # libFuzzer defaults to max_len=4096, which caps JSON nesting at a
          # depth the scanner handles comfortably, so the target would document
          # the stack-overflow risk while being unable to reach it. Give it
          # room to actually build a deep document.
          cargo fuzz run ${{ matrix.target }} -- -max_total_time=$SECS -rss_limit_mb=4096 -max_len=262144
      - name: Upload any crash found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
